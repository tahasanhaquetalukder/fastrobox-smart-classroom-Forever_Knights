# Render Blueprint: Node/Express web service + managed PostgreSQL.
# Deploy: push this repo to GitHub, then in Render "New +" -> "Blueprint".
# Secrets (DEVICE_TOKEN, ADMIN_TOKEN) are generated by Render, never in git.
services:
  - type: web
    name: fastrobox-smart-classroom
    region: singapore
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fastrobox-db
          property: connectionString
      - key: DEVICE_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DEFAULT_ROOM_ID
        sync: false

databases:
  - name: fastrobox-db
    region: singapore
    plan: free
    databaseName: fastrobox
    user: fastrobox