# Render Blueprint: Node/Express web service + managed PostgreSQL.
# Deploy: push this repo to GitHub, then in Render "New +" -> "Blueprint".
# Secrets (DEVICE_TOKEN, ADMIN_TOKEN) are generated by Render, never in git.
services:
  - type: web
    name: fastrobox-smart-classroom
    region: singapore
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fastrobox-db
          property: connectionString
      - key: DEVICE_BOOTSTRAP_ENABLED
        value: "false"
      - key: DEVICE_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: READ_TOKEN
        generateValue: true
      - key: LOGIN_MAX_FAILURES
        value: "5"
      - key: LOGIN_LOCK_MS
        value: "30000"
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: AUTH_FAILURE_LIMIT
        value: "10"
      - key: WRITE_LIMIT
        value: "120"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      # Safe default: alerts are recorded in notification_log but not sent.
      # To enable delivery, set NOTIFY_PROVIDER plus provider credentials in
      # the Render dashboard (never in git).
      - key: NOTIFY_PROVIDER
        value: "log"
      - key: DEFAULT_ROOM_ID
        sync: false

databases:
  - name: fastrobox-db
    region: singapore
    plan: free
    databaseName: fastrobox
    user: fastrobox