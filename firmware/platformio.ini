; PlatformIO project for ESP32-S3-CAM — AI-Powered Smart Classroom (Phase 1)
; NOTE: board/flags below target a generic ESP32-S3 (Freenove-style CAM).
; Adjust `board`, flash/PSRAM settings and USB flags for YOUR exact variant.
; Camera is NOT used in Phase 1; see src/pins.h and docs/pin-map.md.

[env:esp32-s3-cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600
; upload_port = COM5      ; set your serial port
; monitor_port = COM5

board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3

lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
  miguelbalboa/MFRC522@^1.4.11
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit NeoPixel@^1.12.3